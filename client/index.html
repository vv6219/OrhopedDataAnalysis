<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Центр Ортопедии и Травматологии Добрушкина в Сочи</title>
  </head>
  <body style="margin: 0; background-color: #f4f7fa;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML += `<div style="color:red; z-index:9999; position:fixed; top:0; left:0; background:white; padding:20px; border:2px solid red; width: 100%;">
          <h2>Runtime Error!</h2>
          <p>${message}</p>
          <pre>${error ? error.stack : ''}</pre>
        </div>`;
      };
    </script>
  </body>
</html>
